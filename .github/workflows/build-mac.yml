name: build-mac

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        working-directory: app
        run: npm install

      - name: 构建
        working-directory: app
        run: npm run build

      - name: 打包 dmg（x64 + arm64，无签名）
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            app/release/*.dmg
            app/release/*.zip
          if-no-files-found: error
